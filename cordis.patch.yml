# dsh-foxy-bili bundle patch.
# Install with:
#   dsh plugin --profile desktop add file:D:\...\dsh-foxy-bili
#
# After restart, open Settings → Foxy-bili. The dashboard writes
# ~/.dsh/foxy-bili/settings.json and supports QR login; this YAML entry only
# provides defaults for the first run.
- insert:
    - id: foxy-bili
      name: dsh-foxy-bili
      config:
        enabled: false
        ownerUid: ''
        ownerName: ''
        intervalMinutes: 90
        maxVideosPerRun: 5
        browseStart: ''
        browseEnd: ''
        dailyVideoLimit: 20
        interestKeywords: []
        interestCategories: []
        commentMode: 'off'
        maxCommentsPerDay: 1
        replyInbox: false
        replyIntervalMinutes: 10
        maxRepliesPerRun: 1
        enableMemory: true
        memoryPresetId: 'foxy3（Character）'
        mentionOwner: true
        mentionWhitelist: []
        replyOthers: false
        nestedReplies: false
        llmMode: 'dsh'
        llmBaseUrl: 'https://api.deepseek.com'
        llmModel: 'deepseek-chat'
        customPrompt: ''
        runOnStart: false
        debug: false
